name: Hatena Blog Poster (Rakuten & Yahoo Hybrid)

on:
  schedule:
    # 30分間隔（毎時15分・45分）で高頻度トリガー（1回2記事投稿のため、cronが一部スキップされても1日20〜30記事以上を確実に達成）
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      search_keywords:
        description: '検索キーワード（空欄ならランダム自動選定）'
        required: false
        default: ''
      post_platform:
        description: '投稿プラットフォーム（空欄なら自動交互ローテーション、rakuten または yahoo）'
        required: false
        default: ''

jobs:
  auto-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Japanese fonts
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1

    - name: Install Playwright Browsers
      run: playwright install chromium

    - name: Run Mikke Blogger
      env:
        RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
        YAHOO_AFFILIATE_ID: ${{ secrets.YAHOO_AFFILIATE_ID }}
        POST_PLATFORM: ${{ github.event.inputs.post_platform || '' }}
        SEARCH_KEYWORDS: ${{ github.event.inputs.search_keywords || '' }}
        HATENA_ID: ${{ secrets.HATENA_ID }}
        HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
        HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ROOM_SESSION_B64: ${{ secrets.ROOM_SESSION_B64 }}
        HATENA_SESSION_B64: ${{ secrets.HATENA_SESSION_B64 }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'mikke-hobby.bsky.social' }}
        BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      run: |
        python mikke_blogger.py

    - name: Commit and push posted cache and mode state
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add posted_cache.txt post_mode.txt || true
        if ! git diff --cached --quiet; then
          git commit -m "chore: update posted cache & mode [skip ci]"
          git pull --rebase origin HEAD:${{ github.ref }} || git pull --rebase origin main || true
          git push origin HEAD:${{ github.ref }} || git push origin main || true
        else
          echo "No changes in cache or mode."
        fi
